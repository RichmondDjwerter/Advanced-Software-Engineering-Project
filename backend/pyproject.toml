[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.54.0",
    "pillow>=12.3.0",
    "numpy",
]

# OCR and translation (ocr.py, translation.py). Install with: uv sync --extra ml
[project.optional-dependencies]
ml = [
    "torch>=2.14.1",
    "transformers>=5.19.0",
    "sentencepiece>=0.2.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "httpx>=0.28.1",
    "pytest>=8.3.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header", "fastapi.File"]

[tool.ruff.format]
line-ending = "lf"