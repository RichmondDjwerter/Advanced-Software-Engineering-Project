[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.54.0",
    "datasets>=5.1.0",
    "jiwer>=4.0.0",
    "transformers>=5.19.0",
    "qwen-vl-utils>=0.0.14",
    "accelerate>=1.15.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header", "fastapi.File"]
