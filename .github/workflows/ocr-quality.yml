name: OCR quality gate

# Reads 20 CATMuS test lines with the production OCR model and fails if the
# character error rate (CER) gets worse than the allowed maximum. It runs only
# when the OCR code, its evaluation or its dependencies change, because it
# downloads the model (about 1.3 GB) and the test lines.
on:
  pull_request:
    paths:
      - backend/ocr.py
      - backend/evaluation/**
      - backend/pyproject.toml
      - backend/uv.lock
      - .github/workflows/ocr-quality.yml
  workflow_dispatch:
    inputs:
      model_id:
        description: Hugging Face model to evaluate (empty = production model in ocr.py)
        required: false
        default: ""
      max_cer:
        description: Highest character error rate allowed (0.30 = 30 %)
        required: false
        default: "0.30"

permissions:
  contents: read

jobs:
  ocr-quality:
    name: OCR quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      OCR_MODEL_ID: ${{ inputs.model_id }}
      MAX_CER: ${{ inputs.max_cer || '0.30' }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-${{ inputs.model_id || 'production' }}-${{ hashFiles('backend/ocr.py') }}
          restore-keys: hf-

      - name: Evaluate the OCR on 20 CATMuS test lines
        run: |
          # An empty model input means "use the default from ocr.py".
          if [ -z "$OCR_MODEL_ID" ]; then unset OCR_MODEL_ID; fi
          uv run python -m evaluation.ocr_quality \
            --lines 20 \
            --max-cer "$MAX_CER" \
            --report ocr_quality_report.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-quality-report
          path: backend/ocr_quality_report.json
          if-no-files-found: ignore
